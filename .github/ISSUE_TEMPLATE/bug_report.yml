name: Bug report
description: Report a problem with Muto Engine
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include logs — `logs/muto.log` and `logs/latest.log` are usually enough to diagnose most issues.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Clear description of the bug.
      placeholder: When my mod calls MutoApi.reloadAsync(), the game crashes with...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Depend on Muto Engine 0.3.0-beta
        2. Call MutoApi.reloadAsync() after placing a jar in /mods
        3. Exception thrown
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true

  - type: input
    id: muto-version
    attributes:
      label: Muto Engine version
      placeholder: 0.3.0-beta
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Minecraft, Fabric Loader, Fabric API, Java, OS versions.
      placeholder: "MC 26.3, Loader 0.19.5, Fabric API 0.161.0+26.3, Java 25, Windows 11"
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - "HotSpot / OpenJDK (no DCEVM)"
        - "JetBrains Runtime (JBR)"
        - "JVM with DCEVM / AllowEnhancedClassRedefinition"
        - Not sure
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste or attach `logs/muto.log` and `logs/latest.log` (or crash report).
      render: text
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Mod list, code snippet calling the API, or anything else.
    validations:
      required: false

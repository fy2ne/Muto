name: Feature request
description: Suggest an idea or improvement for Muto Engine
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Muto Engine!

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem would this solve? What's missing from the current API?
      placeholder: There's no way to reload a specific mod by ID — only a full /mods rescan...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like Muto Engine to expose or do differently?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you've thought about?
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Reload engine / Knot injection
        - Registry thawing
        - Public API (MutoApi / MutoEvents)
        - Dynamic mixin registration
        - File watcher
        - Documentation
        - Build / CI
        - Other
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Code examples, links to similar tools, or screenshots.
    validations:
      required: false

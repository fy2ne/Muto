name: Feature request
description: Suggest an idea or improvement for Muto
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Muto!

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem would this solve? What's frustrating about the current behavior?
      placeholder: I have to restart the game every time I change a client mod...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like Muto to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you've thought about?
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Reload engine
        - UI / title screen
        - Events / API
        - Documentation
        - Performance
        - Other
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, examples from other mods, or links.
    validations:
      required: false

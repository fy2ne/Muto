plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation "org.junit.jupiter:junit-jupiter-api:5.11.4"
	testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.11.4"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.4"
}



tasks.named('jar') {
	manifest {
		attributes(
			'Premain-Class': 'me.fy2ne.muto.engine.MutoAgent',
			'Agent-Class': 'me.fy2ne.muto.engine.MutoAgent',
			'Can-Retransform-Classes': 'true',
			'Can-Redefine-Classes': 'true'
		)
	}

	doLast {
		if (project.hasProperty('mutoSync') || System.getProperty('muto.sync') == 'true') {
			File runDir = project.file('run')
			File modsDir = new File(runDir, 'mods')
			if (modsDir.exists()) {
				File target = new File(modsDir, archiveFile.get().asFile.name)
				java.nio.file.Files.copy(archiveFile.get().asFile.toPath(), target.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
				File trigger = new File(runDir, 'muto.trigger')
				trigger.text = "reload"
				println "[muto] synced ${target.name} to run/mods"
			}
		}
	}
}

tasks.register('mutoWatch') {
	group = 'muto'
	description = 'Continuous compiler and file-watcher triggering runtime hot swaps.'
	dependsOn tasks.named('jar')

	doLast {
		File runDir = project.file('run')
		File modsDir = new File(runDir, 'mods')
		File trigger = new File(runDir, 'muto.trigger')
		File result = new File(runDir, 'muto.result')
		File jarFile = tasks.named('jar').get().archiveFile.get().asFile

		if (!modsDir.exists()) modsDir.mkdirs()
		File target = new File(modsDir, jarFile.name)
		java.nio.file.Files.copy(jarFile.toPath(), target.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)

		println "[muto:watch] initialized for ${jarFile.name} -> run/mods/"
		println "[muto:watch] watching src/main/java and src/main/resources"

		def watched = [project.file('src/main/java'), project.file('src/main/resources')]
		long lastModified = System.currentTimeMillis()

		while (true) {
			Thread.sleep(250)
			boolean changed = false
			String changedPath = ""

			for (dir in watched) {
				if (dir.exists()) {
					dir.eachFileRecurse { f ->
						if (f.isFile() && f.lastModified() > lastModified) {
							changed = true
							changedPath = f.name
						}
					}
				}
			}

			if (changed) {
				lastModified = System.currentTimeMillis()
				println "[muto:watch] change detected: ${changedPath}, recompiling"
				long t0 = System.currentTimeMillis()

				def cmd = System.getProperty('os.name').toLowerCase().contains('windows') ?
					['cmd', '/c', 'gradlew.bat', 'jar', '-x', 'test', '--quiet'] :
					['./gradlew', 'jar', '-x', 'test', '--quiet']

				def proc = new ProcessBuilder(cmd)
					.directory(project.projectDir)
					.redirectErrorStream(true)
					.start()

				proc.waitFor()
				if (proc.exitValue() == 0 && jarFile.exists()) {
					long compileMs = System.currentTimeMillis() - t0
					java.nio.file.Files.copy(jarFile.toPath(), target.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
					if (result.exists()) result.delete()
					trigger.text = "reload"
					println "[muto:watch] jar packaged in ${compileMs}ms, signal dispatched"

					long waitStart = System.currentTimeMillis()
					boolean responded = false
					while (System.currentTimeMillis() - waitStart < 5000) {
						Thread.sleep(100)
						if (result.exists()) {
							println "[muto:watch] runtime response: ${result.text.trim()}"
							responded = true
							break
						}
					}
					if (!responded) {
						println "[muto:watch] staged to run/mods (awaiting game tick)"
					}
				} else {
					println "[muto:watch] compile failed, check syntax"
				}
				lastModified = System.currentTimeMillis()
			}
		}
	}
}

loom {
	runs {
		client {
			vmArg "-Djdk.attach.allowAttachSelf=true"
			vmArg "-XX:+EnableDynamicAgentLoading"
			property "muto.testAutoReload", System.getProperty("muto.testAutoReload", "false")
			property "muto.testCopyMod", System.getProperty("muto.testCopyMod", "")
			property "muto.testAutoExit", System.getProperty("muto.testAutoExit", "false")
			property "muto.testDelay", System.getProperty("muto.testDelay", "5")
		}
	}
}

tasks.named('runClient').configure {
	dependsOn tasks.named('jar')
	doFirst {
		jvmArgs "-javaagent:${tasks.jar.archiveFile.get().asFile.absolutePath}"
	}
}

test {
	useJUnitPlatform()
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
	withSourcesJar()
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java

			pom {
				name = "Muto Runtime"
				description = "Hot-swap engine for Fabric mods. Load, unload, and update jars at runtime with no JVM restart."
				url = "https://muto.fy2ne.me"
				licenses {
					license {
						name = "All Rights Reserved"
						url = "https://github.com/fy2ne/Muto/blob/26.x/LICENSE"
					}
				}
				developers {
					developer {
						id = "fy2ne"
						name = "fy2ne"
						url = "https://fy2ne.me"
					}
				}
				scm {
					connection = "scm:git:git://github.com/fy2ne/muto.git"
					developerConnection = "scm:git:ssh://github.com:fy2ne/muto.git"
					url = "https://github.com/fy2ne/muto"
				}
			}
		}
	}

	repositories {
		maven {
			name = "GitHubPackages"
			url = uri("https://maven.pkg.github.com/fy2ne/muto")
			credentials {
				username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
				password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
			}
		}
	}
}
